version: '3.8'

services:
  cola-simulator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cola-simulator
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80

  # 可选: 使用 HTTPS (需要证书)
